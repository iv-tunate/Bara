name: Bara CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "Backend/**"
      - "bara-app/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "Backend/**"
      - "bara-app/**"

jobs:
  # Filter which parts of the codebase changed
  paths-filter:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
              - '.github/workflows/**'
            frontend:
              - 'bara-app/**'

  # Build and test backend
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    needs: paths-filter
    if: needs.paths-filter.outputs.backend == 'true'

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: Backend
        run: dotnet restore

      - name: Build
        working-directory: Backend
        run: dotnet build --no-restore --configuration Release

      # Uncomment when you have tests
      # - name: Run tests
      #   working-directory: Backend
      #   run: dotnet test --no-build --configuration Release --verbosity normal

  # Build and push Docker image
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [paths-filter, build-backend]
    if: |
      needs.paths-filter.outputs.backend == 'true' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV=production" >> $GITHUB_OUTPUT
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "ENV=staging" >> $GITHUB_OUTPUT
            echo "TAG=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            fortunateomonuwa/bara-backend:${{ steps.env.outputs.TAG }}
            fortunateomonuwa/bara-backend:${{ github.sha }}
          cache-from: type=registry,ref=fortunateomonuwa/bara-backend:buildcache
          cache-to: type=registry,ref=fortunateomonuwa/bara-backend:buildcache,mode=max

      - name: Create .env file
        run: echo "${{ secrets.ENV_CONTENT }}" > .env

      - name: Test Docker image locally
        run: |
          docker run -d \
            --name bara-test \
            --env-file .env \
            -p 8080:8080 \
            fortunateomonuwa/bara-backend:${{ steps.env.outputs.TAG }}
          
          echo "Waiting for container to start..."
          sleep 30
          
          echo "=== Container Status ==="
          docker ps -a
          
          echo "=== Container Logs ==="
          docker logs bara-test
          
          echo "=== Health Check ==="
          curl -f http://localhost:8080/health/basic_health_check || exit 1
          
          docker stop bara-test
          docker rm bara-test

  # Deploy to Render (Staging)
  deploy-staging:
    name: Deploy to Staging (Render)
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Trigger Render Deploy
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.BACKEND_STAGING_DEPLOY_HOOK }}")
          if [ $response -eq 200 ] || [ $response -eq 201 ]; then
            echo "✅ Staging deployment triggered successfully"
          else
            echo "❌ Staging deployment failed with status $response"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for deployment to complete..."
          sleep 60

      - name: Verify deployment
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://bara-y51u.onrender.com/health/basic_health_check)
          if [ $response -eq 200 ]; then
            echo "✅ Staging deployment verified successfully"
          else
            echo "⚠️ Staging health check returned status $response"
          fi

